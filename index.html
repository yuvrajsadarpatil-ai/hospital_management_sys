<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <title>CarePoint · Hospital Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">✚</span><span>CarePoint</span></div>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="navigation" id="navigation" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">?</div><div><strong>Need help?</strong><span>Visit our help center</span></div></div>
        <div class="profile"><div class="avatar admin-avatar">AM</div><div class="profile-copy"><strong>Alex Morgan</strong><span>Administrator</span></div><button class="icon-button" aria-label="Profile options">···</button></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button class="mobile-menu icon-button" id="menuButton" aria-label="Open menu">☰</button><div class="breadcrumb"><span>CarePoint</span><span class="crumb-sep">/</span><strong id="crumbCurrent">Dashboard</strong></div><div class="top-actions"><label class="global-search"><span>⌕</span><input id="globalSearch" placeholder="Search anything..." aria-label="Search anything"><kbd>⌘ K</kbd></label><button class="icon-button notification" aria-label="Notifications">♧<i></i></button><div class="top-profile"><div class="avatar admin-avatar">AM</div><span>Alex Morgan</span><span class="down">⌄</span></div></div></header>
      <div class="page" id="page"></div>
      <footer>© 2024 CarePoint Hospital Management System <span>Need assistance? <a href="mailto:support@carepoint.local">Contact support</a></span></footer>
    </main>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <dialog id="appDialog" class="modal"><form method="dialog" id="dialogForm"><div class="modal-head"><div><div class="eyebrow" id="dialogEyebrow">CAREPOINT</div><h2 id="dialogTitle">Add record</h2></div><button class="icon-button close-button" value="cancel" aria-label="Close">×</button></div><div class="modal-body" id="dialogBody"></div><div class="modal-actions" id="dialogActions"></div></form></dialog>
  <script src="app.js"></script>
</body>
</html>
